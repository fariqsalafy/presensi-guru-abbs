<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Presensi Guru — SMP ABBS Surakarta</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%; overflow: hidden;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  background: #0a0f1a; color: #e2e8f0;
}
/* ===== TOP BAR (Design C) ===== */
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; background: #0a0f1a; border-bottom: 1px solid #1e293b;
  flex-shrink: 0;
}
.top-bar .logo { font-size: 16px; font-weight: 800; color: #fbbf24; letter-spacing: 1px; }
.top-bar .icons { display: flex; gap: 12px; color: #64748b; font-size: 18px; }
.top-bar .icons span { cursor: pointer; }
/* ===== APP ===== */
#app {
  display: flex; flex-direction: column;
  height: calc(100% - 46px); max-width: 480px; margin: 0 auto;
  padding: 8px 16px 16px; gap: 10px;
}
/* ===== DATE BADGE ===== */
.date-badge {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: #64748b; flex-shrink: 0;
}
.date-badge .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #4ade80; display: inline-block;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
.date-badge strong { color: #e2e8f0; font-weight: 600; }
/* ===== TEACHER ===== */
.teacher-area { flex-shrink: 0; }
.search-wrap { position: relative; }
.search-wrap input {
  width: 100%; padding: 10px 14px 10px 38px;
  border: 1.5px solid #1e293b; border-radius: 10px;
  background: #0b1120; color: #e2e8f0;
  font-size: 14px; outline: none; transition: border .2s;
}
.search-wrap input:focus { border-color: #fbbf24; }
.search-wrap input::placeholder { color: #475569; }
.search-icon {
  position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%); color: #475569; font-size: 15px; pointer-events: none;
}
.dropdown-wrap { position: relative; margin-top: 6px; }
.dropdown-wrap select {
  width: 100%; padding: 10px 14px;
  border: 1.5px solid #1e293b; border-radius: 10px;
  background: #0b1120; color: #e2e8f0;
  font-size: 14px; outline: none; appearance: none; cursor: pointer;
  -webkit-appearance: none;
}
.dropdown-wrap::after {
  content: '▾'; position: absolute; right: 14px; top: 50%;
  transform: translateY(-50%); color: #fbbf24;
  pointer-events: none; font-size: 13px;
}
.dropdown-wrap select:focus { border-color: #fbbf24; }
.dropdown-wrap select option { background: #0b1120; color: #e2e8f0; }
/* ===== CAMERA ===== */
.camera-area {
  flex: 1; min-height: 0;
  position: relative; border-radius: 14px;
  overflow: hidden; background: #000;
  border: 1.5px solid #1e293b;
}
.camera-area video { width: 100%; height: 100%; object-fit: cover; }
.camera-area .placeholder {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: #475569;
}
.camera-area .placeholder .icon { font-size: 52px; margin-bottom: 8px; }
.camera-area .placeholder .text { font-size: 13px; color: #64748b; }
.camera-overlay {
  position: absolute; bottom: 0; left: 0; right: 0;
  display: flex; justify-content: center; gap: 10px;
  padding: 12px;
  background: linear-gradient(transparent, rgba(0,0,0,0.7));
}
.btn-capture, .btn-retake {
  padding: 9px 32px; border-radius: 30px;
  border: none; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all .2s;
}
.btn-capture { background: #fbbf24; color: #0a0f1a; }
.btn-capture:active { transform: scale(0.95); }
.btn-retake { background: rgba(255,255,255,0.12); color: #e2e8f0; backdrop-filter: blur(8px); }
.camera-area canvas { display: none; }
.camera-area img.captured { width: 100%; height: 100%; object-fit: cover; }
/* ===== BOTTOM ===== */
.bottom-area {
  flex-shrink: 0;
  display: flex; gap: 8px; align-items: stretch;
}
.location-box {
  flex: 1;
  padding: 8px 12px;
  border-radius: 10px; border: 1.5px solid #1e293b;
  background: #0b1120; font-size: 12px;
  display: flex; flex-direction: column;
  justify-content: center;
}
.location-box .top-row { display: flex; align-items: center; gap: 6px; }
.location-box .stat { color: #94a3b8; }
.location-box .stat.ok { color: #4ade80; }
.location-box .stat.loading { color: #fbbf24; }
.location-box .stat.fail { color: #f87171; }
.location-box .coords { color: #475569; font-size: 10px; margin-top: 2px; }
.btn-loc-refresh {
  background: none; border: 1.5px solid #1e293b;
  border-radius: 10px;
  color: #64748b; cursor: pointer;
  font-size: 18px; padding: 0 12px;
  transition: all .2s; display: flex; align-items: center;
  flex-shrink: 0;
}
.btn-loc-refresh:hover { border-color: #fbbf24; color: #fbbf24; }
.btn-loc-refresh:active { transform: scale(0.92); }
.btn-submit {
  padding: 0 24px; border-radius: 10px;
  border: none; background: #fbbf24; color: #0a0f1a;
  font-size: 14px; font-weight: 700; cursor: pointer;
  transition: all .2s; white-space: nowrap;
}
.btn-submit:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-submit:not(:disabled):active { transform: scale(0.97); }
.btn-submit.sending { background: #d97706; pointer-events: none; }
/* ===== TOAST ===== */
.toast {
  position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
  padding: 10px 24px; border-radius: 12px;
  font-size: 13px; font-weight: 600; z-index: 999;
  transition: all .3s; opacity: 0; pointer-events: none;
  max-width: 90%; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.toast.show { opacity: 1; }
.toast.success { background: #166534; color: #bbf7d0; }
.toast.error { background: #991b1b; color: #fecaca; }
select::-webkit-scrollbar { width: 5px; }
select::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
</style>
</head>
<body>

<div class="top-bar">
  <div class="logo">PRESENSI</div>
  <div class="icons"><span title="Info">ℹ</span><span title="Atur">⚙</span></div>
</div>

<div id="app">
  <div class="date-badge">
    <span class="dot"></span>
    <span>Hari ini — <strong id="dateLabel"></strong></span>
  </div>

  <div class="teacher-area">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input id="searchInput" type="text" placeholder="Cari nama guru..." oninput="filterTeachers()">
    </div>
    <div class="dropdown-wrap">
      <select id="teacherSelect" onchange="clearStatus()">
        <option value="">— Pilih Guru —</option>
      </select>
    </div>
  </div>

  <div class="camera-area" id="cameraArea">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <img id="capturedImg" class="captured" style="display:none" alt="Foto">
    <div class="placeholder" id="camPlaceholder">
      <div class="icon">📷</div>
      <div class="text">Kamera akan aktif otomatis</div>
    </div>
    <div class="camera-overlay">
      <button class="btn-capture" id="btnCapture" onclick="capturePhoto()">📸 Ambil Foto</button>
      <button class="btn-retake" id="btnRetake" onclick="retakePhoto()" style="display:none">↺ Ulang</button>
    </div>
  </div>

  <div class="bottom-area">
    <div class="location-box" id="locationBox">
      <div class="top-row">
        <span class="stat loading" id="locStatus">📍 Mendapatkan lokasi...</span>
      </div>
      <div class="coords" id="locCoords"></div>
    </div>
    <button class="btn-loc-refresh" id="btnLocRefresh" onclick="refreshLocation()" title="Ambil ulang lokasi">⟳</button>
    <button class="btn-submit" id="btnSubmit" onclick="submitPresensi()" disabled>KIRIM</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ====== SUPABASE CONFIG ======
const SUPABASE_URL = 'https://xyypuwjpmbkxxlladqtp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_88Zpk6jMbR8yf4k56_AHtw_ersLMAq6';
const TABLE = 'presensi_guru';
// Gunakan WIB (UTC+7) untuk tanggal
function todayWIB() {
  const d = new Date(Date.now() + 7 * 3600000);
  return d.toISOString().slice(0,10);
}
const TODAY = todayWIB();

const TEACHERS = [
  "Adila Rahmah","Amien Nur Wicaksono","Andi Wijayanto","Arfian Moneter Pratama",
  "Arif Hidayat","Arvino Nurvieri Kusuma","Asnia Novitasari",
  "Aulia Qisthi Rosyada","Binti Qoeroti",
  "Charlieta Nova Putri Fedito","Danang Dwi Pambudi",
  "Fadlan Rifai Al-Irsyad","Fatma Roudhotul Rafida Kolis",
  "Febri Cahya Syahputra","Fitri Nur Kolifah",
  "Hang Sakti Abdullah","Hari Rohmah",
  "Ida Aryani","Ifan Destya Adi Tama","Iin Indah Saputri",
  "Isti Qomah Nurul Izzati","Joko Ariyanto","Luthfa Usaidah",
  "Ms Zahro","Muamar Fariq Salafy","Muhammad Fahmi Aziz",
  "Muhammad Jauhari Ahmad","Musfiq Amrulloh","Nur Rohmah Hidayanti",
  "Scindy Nourma Pratiwi","Sharih Shadri",
  "Siti Khoimah","Siti Robiatul Adawiyah","Siti Sirril Inayah",
  "Siti Zamronah Rizqiah","Syarah Karina Putri",
  "Wafda Salsabila","Yoki Wirawan","Yona Puspa Ningtias"
];

let capturedPhotoData = null;
let currentPosition = null;
let cameraStream = null;
let isCameraReady = false;
let isSubmitting = false;
let isLocating = false;

document.addEventListener('DOMContentLoaded', () => {
  // Set date
  const days = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
  const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const d = new Date();
  document.getElementById('dateLabel').textContent =
    days[d.getDay()] + ', ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
  populateTeachers();
  initCamera();
  getLocation();
});

function populateTeachers() {
  const sel = document.getElementById('teacherSelect');
  TEACHERS.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    sel.appendChild(opt);
  });
}

function filterTeachers() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const sel = document.getElementById('teacherSelect');
  let firstVisible = false;
  for (let opt of sel.options) {
    if (!opt.value) continue;
    const match = opt.value.toLowerCase().includes(q);
    opt.style.display = match ? 'block' : 'none';
    if (match && !firstVisible) {
      if (sel.value !== opt.value) sel.value = opt.value;
      firstVisible = true;
    }
  }
  if (!firstVisible && q) sel.value = '';
}

function clearStatus() { hideToast(); }

async function initCamera() {
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    const video = document.getElementById('video');
    video.srcObject = cameraStream;
    await video.play();
    isCameraReady = true;
    document.getElementById('camPlaceholder').style.display = 'none';
    document.getElementById('video').style.display = 'block';
  } catch (err) {
    document.querySelector('#camPlaceholder .text').textContent =
      '❌ Tidak bisa akses kamera. Ketuk "Ambil Foto"';
    setupFallbackCamera();
  }
}

function setupFallbackCamera() {
  const area = document.getElementById('cameraArea');
  const fallbackInput = document.createElement('input');
  fallbackInput.type = 'file';
  fallbackInput.accept = 'image/*';
  fallbackInput.capture = 'user';
  fallbackInput.style.display = 'none';
  fallbackInput.id = 'fallbackCam';
  fallbackInput.onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      const imgData = ev.target.result;
      capturedPhotoData = imgData;
      const img = document.getElementById('capturedImg');
      img.src = imgData;
      img.style.display = 'block';
      document.getElementById('video').style.display = 'none';
      document.getElementById('camPlaceholder').style.display = 'none';
      document.getElementById('btnCapture').style.display = 'none';
      document.getElementById('btnRetake').style.display = 'inline-block';
      checkReady();
    };
    reader.readAsDataURL(file);
  };
  area.appendChild(fallbackInput);
  document.getElementById('btnCapture').onclick = function() {
    document.getElementById('fallbackCam').click();
  };
}

function capturePhoto() {
  if (!isCameraReady) {
    const fb = document.getElementById('fallbackCam');
    if (fb) { fb.click(); }
    return;
  }
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  let w = video.videoWidth;
  let h = video.videoHeight;
  const MAX = 640;
  if (w > MAX || h > MAX) {
    if (w > h) { h = h * MAX / w; w = MAX; }
    else { w = w * MAX / h; h = MAX; }
  }
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, w, h);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
  capturedPhotoData = dataUrl;
  const img = document.getElementById('capturedImg');
  img.src = dataUrl;
  img.style.display = 'block';
  video.style.display = 'none';
  document.getElementById('camPlaceholder').style.display = 'none';
  document.getElementById('btnCapture').style.display = 'none';
  document.getElementById('btnRetake').style.display = 'inline-block';
  checkReady();
  showToast('📸 Foto berhasil diambil', 'success');
}

function retakePhoto() {
  capturedPhotoData = null;
  document.getElementById('capturedImg').style.display = 'none';
  document.getElementById('btnRetake').style.display = 'none';
  document.getElementById('btnCapture').style.display = 'inline-block';
  if (cameraStream) {
    document.getElementById('video').style.display = 'block';
  } else {
    document.getElementById('camPlaceholder').style.display = 'flex';
  }
  checkReady();
}

function refreshLocation() {
  currentPosition = null;
  isLocating = false;
  const status = document.getElementById('locStatus');
  status.className = 'stat loading';
  status.textContent = '📍 Mengambil ulang lokasi...';
  document.getElementById('locCoords').textContent = '';
  checkReady();
  getLocation();
}

function getLocation() {
  if (isLocating) return;
  isLocating = true;
  if (!navigator.geolocation) {
    document.getElementById('locStatus').className = 'stat fail';
    document.getElementById('locStatus').textContent = '📍 GPS tidak didukung browser';
    isLocating = false;
    return;
  }
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      currentPosition = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy };
      const status = document.getElementById('locStatus');
      status.className = 'stat ok';
      status.textContent = '📍 Lokasi didapatkan';
      const accText = currentPosition.acc < 50 ? 'Akurat' : 'Kurang akurat';
      document.getElementById('locCoords').textContent =
        `${currentPosition.lat.toFixed(5)}, ${currentPosition.lng.toFixed(5)} ±${currentPosition.acc.toFixed(0)}m (${accText})`;
      isLocating = false;
      checkReady();
    },
    (err) => {
      const status = document.getElementById('locStatus');
      status.className = 'stat fail';
      status.textContent = '📍 Gagal dapat lokasi';
      document.getElementById('locCoords').textContent =
        err.code === 1 ? 'Izin lokasi ditolak — ketuk ⟳ untuk coba lagi' : err.message;
      isLocating = false;
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 }
  );
}

function checkReady() {
  const teacher = document.getElementById('teacherSelect').value;
  const btn = document.getElementById('btnSubmit');
  btn.disabled = !(teacher && capturedPhotoData && currentPosition);
}

async function submitPresensi() {
  if (isSubmitting) return;
  isSubmitting = true;
  const btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  btn.textContent = '⏳ MENGIRIM...';
  btn.classList.add('sending');
  const teacher = document.getElementById('teacherSelect').value;

  try {
    const dupRes = await fetch(
      SUPABASE_URL + '/rest/v1/' + TABLE + '?teacher_name=eq.' + encodeURIComponent(teacher) + '&tgl=eq.' + TODAY + '&select=id',
      { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } }
    );
    if (dupRes.ok) {
      const dupData = await dupRes.json();
      if (dupData && dupData.length > 0) {
        showToast('❌ ' + teacher + ' sudah absen hari ini!', 'error');
        isSubmitting = false; btn.textContent = 'KIRIM'; btn.classList.remove('sending'); btn.disabled = true;
        return;
      }
    }
  } catch (_) {}

  const payload = {
    teacher_name: teacher,
    photo_data: capturedPhotoData,
    latitude: currentPosition.lat,
    longitude: currentPosition.lng,
    tgl: TODAY,
    location_accuracy: currentPosition.acc
  };

  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/' + TABLE, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Prefer': 'return=representation'
      },
      body: JSON.stringify(payload)
    });
    if (res.ok) {
      showToast('✅ Presensi berhasil dicatat!', 'success');
      setTimeout(() => {
        document.getElementById('teacherSelect').value = '';
        document.getElementById('searchInput').value = '';
        filterTeachers();
        retakePhoto();
        refreshLocation();
      }, 1500);
    } else {
      const err = await res.json().catch(() => ({}));
      showToast('❌ Gagal: ' + (err.message || err.error || 'Unknown'), 'error');
    }
  } catch (err) {
    showToast('❌ Koneksi error: ' + err.message, 'error');
  } finally {
    isSubmitting = false; btn.textContent = 'KIRIM'; btn.classList.remove('sending'); btn.disabled = true;
  }
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  setTimeout(hideToast, 3000);
}
function hideToast() { document.getElementById('toast').className = 'toast'; }

document.getElementById('teacherSelect').addEventListener('change', checkReady);
</script>
</body>
</html>
