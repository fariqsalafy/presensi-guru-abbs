<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Rekap Presensi — SMP ABBS Surakarta</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0f172a; color: #e2e8f0; min-height: 100vh;
}
/* TITLE BAR */
.title-bar {
  background: linear-gradient(135deg,#1e293b 0%,#0f172a 100%);
  padding: 14px 16px 10px; text-align: center;
  border-bottom: 1px solid #1e293b;
}
.title-bar h1 { font-size: 18px; font-weight: 800; color: #fbbf24; letter-spacing: 2px; }
.title-bar .sub { font-size: 11px; color: #94a3b8; letter-spacing: 1px; margin-top: 1px; }
/* WRAP */
.wrap { max-width: 100%; overflow-x: auto; }
table {
  width: 100%; border-collapse: separate; border-spacing: 0;
  font-size: 12px; min-width: max-content;
  border: none; border-radius: 0;
}
thead { position: sticky; top: 0; z-index: 40; }
th {
  background: #0f172a; color: #94a3b8; font-weight: 700;
  padding: 10px 4px; text-align: center; white-space: nowrap;
  border-bottom: 1px solid #1e293b;
  font-size: 10px; letter-spacing: 0.3px;
}
th.sticky-name { position: sticky; left: 0; z-index: 42; background: #0f172a; min-width: 155px; text-align: left; padding-left: 10px; }
th .range-label { color: #38bdf8; font-weight: 400; font-size: 8px; display: block; letter-spacing: 0; margin-top: 1px; }
td {
  padding: 5px 3px; text-align: center; border-bottom: 1px solid #1e293b;
  vertical-align: middle;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: #1e293b88; }
td.sticky-name { position: sticky; left: 0; z-index: 1; background: #0f172a; text-align: left; padding-left: 10px; font-weight: 600; color: #f1f5f9; font-size: 12px; }
tr:hover td.sticky-name { background: #1e293b; }
/* TIME CELLS */
td.time { font-family: 'SF Mono','Menlo','Fira Code',monospace; font-size: 11px; font-weight: 600; cursor: pointer; padding: 5px 3px; min-width: 38px; }
td.time-ontime { color: #4ade80; }
td.time-ontime:hover { background: #16653455; border-radius: 3px; }
td.time-late { color: #fbbf24; }
td.time-late:hover { background: #78350f55; border-radius: 3px; }
td.absent { color: #334155; font-size: 11px; }
td.absent-future { color: #1e293b; font-size: 11px; }
/* TOT & HADIR */
td.stat { font-weight: 700; font-size: 12px; padding: 5px 8px; }
td.tot { color: #facc15; }
td.hadir { color: #4ade80; }
/* LOADING */
.loading-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; gap: 16px; }
.spinner { width: 36px; height: 36px; border: 3px solid #1e293b; border-top-color: #fbbf24; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-wrap p { color: #94a3b8; font-size: 14px; }
/* REFRESH */
.float-refresh {
  position: fixed; bottom: 20px; right: 20px; z-index: 99;
  width: 44px; height: 44px; border-radius: 50%;
  background: #1e293b; color: #fbbf24; border: 1px solid #334155;
  font-size: 20px; cursor: pointer; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center;
}
.float-refresh:hover { background: #334155; }
/* MODAL */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  display: none; align-items: center; justify-content: center;
  z-index: 999; padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: #1e293b; border-radius: 16px; padding: 20px;
  max-width: 440px; width: 100%; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6); text-align: center;
}
.modal-box h3 { font-size: 16px; color: #f1f5f9; margin-bottom: 4px; }
.modal-box .modal-date { font-size: 12px; color: #94a3b8; margin-bottom: 12px; }
.modal-box .modal-coords { font-size: 11px; color: #64748b; margin-top: 8px; word-break: break-all; }
.modal-box img { max-width: 100%; border-radius: 12px; margin-top: 8px; }
.modal-close {
  display: inline-block; margin-top: 14px; padding: 8px 24px;
  background: #334155; color: #e2e8f0; border: none; border-radius: 10px;
  font-size: 13px; font-weight: 600; cursor: pointer;
}
.modal-close:hover { background: #475569; }
.modal-delete {
  display: inline-block; margin-top: 14px; margin-left: 8px; padding: 8px 24px;
  background: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; border-radius: 10px;
  font-size: 13px; font-weight: 600; cursor: pointer;
}
.modal-delete:hover { background: #991b1b; }
/* BUTTON BAR */
.btn-bar {
  display: flex; gap: 8px; justify-content: center; padding: 10px 16px;
  background: #0f172a; border-bottom: 1px solid #1e293b; flex-wrap: wrap;
}
.btn-bar button {
  padding: 8px 18px; border: 1px solid #334155; border-radius: 10px;
  font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex;
  align-items: center; gap: 6px; letter-spacing: 0.3px;
}
.btn-export {
  background: #1e293b; color: #38bdf8;
}
.btn-export:hover { background: #334155; }
/* NO DATA */
.empty { text-align: center; padding: 40px 20px; color: #64748b; font-size: 14px; }
/* MOBILE */
@media(max-width:640px){
  .title-bar h1 { font-size: 15px; }
  th { font-size: 9px; padding: 8px 2px; }
  th.sticky-name { min-width: 110px; font-size: 9px; }
  td { padding: 4px 2px; font-size: 10px; }
  td.sticky-name { min-width: 110px; font-size: 11px; }
  td.time { font-size: 10px; min-width: 32px; }
}
</style>
</head>
<body>

<div class="title-bar">
  <h1>REKAP PRESENSI</h1>
  <div class="sub">SMP ABBS Surakarta</div>
</div>

<div class="btn-bar">
  <button class="btn-export" onclick="exportExcel()">⎙ Export Excel</button>
</div>

<div id="contentWrap"><div class="loading-wrap"><div class="spinner"></div><p>Memuat data rekap...</p></div></div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal-box" id="modalBox">
    <h3 id="modalName"></h3>
    <div class="modal-date" id="modalDate"></div>
    <img id="modalImg" src="" alt="Foto">
    <div class="modal-coords" id="modalCoords"></div>
    <button class="modal-close" onclick="closeModal()">Tutup</button>
    <button class="modal-delete" id="modalDeleteBtn" onclick="deleteRecord()">✕ Hapus</button>
  </div>
</div>

<script>
// ====== CONFIG ======
const SUPABASE_URL = 'https://xyypuwjpmbkxxlladqtp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_88Zpk6jMbR8yf4k56_AHtw_ersLMAq6';
const TABLE = 'presensi_guru';

const TEACHERS = [
  "Adila Rahmah","Amien Nur Wicaksono","Andi Wijayanto","Arfian Moneter Pratama",
  "Arif Hidayat","Arvino Nurvieri Kusuma","Asnia Novitasari",
  "Aulia Qisthi Rosyada","Binti Qoeroti",
  "Charlieta Nova Putri Fedito","Danang Dwi Pambudi",
  "Fadlan Rifai Al-Irsyad","Fatma Roudhotul Rafida Kolis",
  "Febri Cahya Syahputra","Fitri Nur Kolifah",
  "Hang Sakti Abdullah","Hari Rohmah",
  "Ida Aryani","Ifan Destya Adi Tama","Iin Indah Saputri",
  "Isti Qomah Nurul Izzati","Joko Ariyanto","Luthfa Usaidah",
  "Ms Zahro","Muamar Fariq Salafy","Muhammad Fahmi Aziz",
  "Muhammad Jauhari Ahmad","Musfiq Amrulloh","Nur Rohmah Hidayanti",
  "Scundy Nourma Pratiwi","Sharih Shadri",
  "Siti Khoimah","Siti Robiatul Adawiyah","Siti Sirril Inayah",
  "Siti Zamronah Rizqiah","Syarah Karina Putri",
  "Wafda Salsabila","Yoki Wirawan","Yona Puspa Ningtias"
];

// ====== DATE HELPERS ======
function getDateRange() {
  const now = new Date();
  const curY = now.getFullYear();
  const curM = now.getMonth();
  let startM = curM, startY = curY;
  if (now.getDate() < 21) {
    startM = curM - 1;
    if (startM < 0) { startM = 11; startY--; }
  }
  const endM = startM + 1;
  const endY = startY + (endM > 11 ? 1 : 0);
  const start = new Date(startY, startM, 21);
  const end = new Date(endY, endM % 12, 20);
  const dates = [];
  const d = new Date(start);
  while (d <= end) {
    dates.push(d.toISOString().slice(0,10));
    d.setDate(d.getDate() + 1);
  }
  return dates;
}

function fmtDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  return d.getDate() + ' ' + months[d.getMonth()];
}

function fmtDateFull(iso) {
  const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const d = new Date(iso + 'T00:00:00');
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}

// ====== WIB TIME FROM ISO ======
function wibTime(iso) {
  const d = new Date(iso);
  const h = (d.getUTCHours() + 7) % 24;
  const m = d.getUTCMinutes();
  return { h, m, str: String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') };
}

// ====== STATE ======
let cachedRecords = [];
let modalRecordId = null;

// ====== MAIN ======
async function loadData() {
  const wrap = document.getElementById('contentWrap');
  wrap.innerHTML = '<div class="loading-wrap"><div class="spinner"></div><p>Memuat data rekap...</p></div>';

  const dates = getDateRange();
  const rangeLabel = fmtDateFull(dates[0]) + ' — ' + fmtDateFull(dates[dates.length-1]);

  try {
    const url = SUPABASE_URL + '/rest/v1/' + TABLE +
      '?select=id,teacher_name,tgl,created_at,latitude,longitude,location_accuracy' +
      '&tgl=gte.' + dates[0] + '&tgl=lte.' + dates[dates.length-1] +
      '&order=tgl.asc';
    const res = await fetch(url, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const rows = await res.json();
    cachedRecords = rows || [];

    const lookup = {};
    for (const r of cachedRecords) {
      lookup[r.teacher_name + '|' + r.tgl] = r;
    }

    // Calculate ToT and total per teacher
    const totCount = {};
    const hadirCount = {};
    for (const r of cachedRecords) {
      hadirCount[r.teacher_name] = (hadirCount[r.teacher_name] || 0) + 1;
      const { h, m } = wibTime(r.created_at);
      if (h < 6 || (h === 6 && m < 51)) {
        totCount[r.teacher_name] = (totCount[r.teacher_name] || 0) + 1;
      }
    }

    // Build table
    let html = '<div class="wrap"><table><thead><tr>';
    html += '<th class="sticky-name">Nama <span class="range-label">' + rangeLabel + '</span></th>';
    for (const d of dates) {
      html += '<th>' + fmtDate(d) + '</th>';
    }
    html += '<th class="tot">ToT</th>';
    html += '<th class="hadir">Total<br>Hadir</th>';
    html += '</tr></thead><tbody>';

    for (let i = 0; i < TEACHERS.length; i++) {
      const teacher = TEACHERS[i];
      html += '<tr>';
      html += '<td class="sticky-name">' + teacher + '</td>';
      for (const d of dates) {
        const key = teacher + '|' + d;
        const rec = lookup[key];
        if (rec) {
          const { h, m, str } = wibTime(rec.created_at);
          const cls = (h < 6 || (h === 6 && m < 51)) ? 'time-ontime' : 'time-late';
          html += '<td class="time ' + cls + '" onclick="openModal(\'' + rec.id + '\')">' + str + '</td>';
        } else {
          const dObj = new Date(d + 'T00:00:00');
          const today = new Date();
          today.setHours(0,0,0,0);
          if (dObj < today) {
            html += '<td class="absent">—</td>';
          } else {
            html += '<td class="absent-future">·</td>';
          }
        }
      }
      html += '<td class="stat tot">' + (totCount[teacher] || 0) + '</td>';
      html += '<td class="stat hadir">' + (hadirCount[teacher] || 0) + '</td>';
      html += '</tr>';
    }

    html += '</tbody></table></div>';
    html += '<button class="float-refresh" onclick="loadData()" title="Muat ulang">↻</button>';
    wrap.innerHTML = html;

  } catch (err) {
    wrap.innerHTML = '<div class="empty">❌ Gagal memuat data: ' + err.message + '</div>';
  }
}

// ====== MODAL ======
async function openModal(recordId) {
  const overlay = document.getElementById('modalOverlay');
  const nameEl = document.getElementById('modalName');
  const dateEl = document.getElementById('modalDate');
  const imgEl = document.getElementById('modalImg');
  const coordsEl = document.getElementById('modalCoords');
  const deleteBtn = document.getElementById('modalDeleteBtn');

  nameEl.textContent = 'Memuat...';
  dateEl.textContent = '';
  imgEl.src = '';
  coordsEl.textContent = '';
  modalRecordId = recordId;
  overlay.classList.add('show');

  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/' + TABLE + '?id=eq.' + recordId + '&select=*', {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data || !data.length) throw new Error('Data tidak ditemukan');

    const rec = data[0];
    nameEl.textContent = rec.teacher_name;
    const { str: wib } = wibTime(rec.created_at);
    dateEl.textContent = fmtDateFull(rec.tgl) + ' · ' + wib + ' WIB';
    imgEl.src = rec.photo_data;
    if (rec.latitude && rec.longitude) {
      coordsEl.textContent = rec.latitude.toFixed(5) + ', ' + rec.longitude.toFixed(5) +
        (rec.location_accuracy ? ' ±' + rec.location_accuracy.toFixed(0) + 'm' : '');
    }
  } catch (err) {
    nameEl.textContent = 'Error';
    dateEl.textContent = err.message;
    imgEl.src = '';
  }
}

function closeModal(ev) {
  if (ev && ev.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.remove('show');
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') document.getElementById('modalOverlay').classList.remove('show');
});
document.getElementById('modalOverlay').addEventListener('click', function(ev) {
  if (ev.target === this) this.classList.remove('show');
});

// ====== EXPORT EXCEL ======
function exportExcel() {
  const dates = getDateRange();
  const rangeLabel = fmtDateFull(dates[0]) + ' — ' + fmtDateFull(dates[dates.length-1]);
  const lookup = {};
  for (const r of cachedRecords) {
    lookup[r.teacher_name + '|' + r.tgl] = r;
  }

  // Hitung ToT & Hadir
  const totCount = {}, hadirCount = {};
  for (const r of cachedRecords) {
    hadirCount[r.teacher_name] = (hadirCount[r.teacher_name] || 0) + 1;
    const { h, m } = wibTime(r.created_at);
    if (h < 6 || (h === 6 && m < 51)) totCount[r.teacher_name] = (totCount[r.teacher_name] || 0) + 1;
  }

  // === Build data array ===
  const headers = ['Nama'];
  for (const d of dates) headers.push(fmtDate(d));
  headers.push('ToT', 'Total Hadir');

  const rows = [headers];
  for (const teacher of TEACHERS) {
    const row = [teacher];
    for (const d of dates) {
      const rec = lookup[teacher + '|' + d];
      if (rec) {
        const { h, m, str } = wibTime(rec.created_at);
        row.push(str + ((h < 6 || (h === 6 && m < 51)) ? '' : '⚠'));
      } else {
        const dObj = new Date(d + 'T00:00:00');
        const today = new Date(); today.setHours(0,0,0,0);
        row.push(dObj < today ? '—' : '');
      }
    }
    row.push(totCount[teacher] || 0);
    row.push(hadirCount[teacher] || 0);
    rows.push(row);
  }

  // === SheetJS workbook ===
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);

  // Column widths
  ws['!cols'] = [
    { wch: 24 },  // Nama
    ...dates.map(() => ({ wch: 8 })),
    { wch: 6 },   // ToT
    { wch: 10 },  // Total Hadir
  ];

  // === styling ===
  const darkBg = { patternType: 'solid', fgColor: { rgb: '0F172A' } };
  const gold = { rgb: 'FBBF24' };
  const green = { rgb: '4ADE80' };
  const red = { rgb: 'FCA5A5' };
  const muted = { rgb: '94A3B8' };
  const white = { rgb: 'F1F5F9' };
  const headerFont = { bold: true, color: muted, sz: 10 };
  const nameFont = { bold: true, color: white, sz: 11 };
  const statFontGold = { bold: true, color: gold, sz: 12 };
  const statFontGreen = { bold: true, color: green, sz: 12 };
  const cellBorder = {
    top: { style: 'thin', color: { rgb: '1E293B' } },
    bottom: { style: 'thin', color: { rgb: '1E293B' } },
  };

  // Header row (row 1)
  const ncols = headers.length;
  for (let c = 0; c < ncols; c++) {
    const ref = XLSX.utils.encode_cell({ r: 0, c });
    if (!ws[ref]) ws[ref] = {};
    ws[ref].s = { font: headerFont, fill: darkBg, alignment: { horizontal: 'center', vertical: 'middle' }, border: cellBorder };
  }

  // Data rows (row 2+)
  for (let r = 1; r < rows.length; r++) {
    for (let c = 0; c < ncols; c++) {
      const ref = XLSX.utils.encode_cell({ r, c });
      if (!ws[ref]) ws[ref] = {};
      const style = { fill: darkBg, alignment: { vertical: 'middle' }, border: cellBorder };
      if (c === 0) {
        style.font = nameFont;
        style.alignment = { horizontal: 'left', vertical: 'middle' };
      } else if (c === ncols - 2) { // ToT
        style.font = statFontGold;
        style.alignment = { horizontal: 'center', vertical: 'middle' };
      } else if (c === ncols - 1) { // Total Hadir
        style.font = statFontGreen;
        style.alignment = { horizontal: 'center', vertical: 'middle' };
      } else {
        style.font = { color: muted, sz: 10 };
        style.alignment = { horizontal: 'center', vertical: 'middle' };
      }
      ws[ref].s = style;

      // Warna sel time: ontime = green, late = gold
      if (c > 0 && c < ncols - 2) {
        const val = rows[r][c];
        if (val && !val.startsWith('—') && val !== '') {
          if (val.endsWith('⚠')) {
            style.font = { color: gold, bold: true, sz: 10 };
            ws[ref].s = style;
          } else {
            style.font = { color: green, sz: 10 };
            ws[ref].s = style;
          }
        } else if (val === '—') {
          style.font = { color: { rgb: '334155' }, sz: 10 };
          ws[ref].s = style;
        }
      }
    }
  }

  // Freeze pane (column Nama + header row)
  ws['!freeze'] = { xSplit: 1, ySplit: 1 };

  // Sheet name
  XLSX.utils.book_append_sheet(wb, ws, 'Rekap Presensi');
  XLSX.writeFile(wb, 'rekap-presensi-' + dates[0] + '.xlsx');
}

// ====== DELETE RECORD ======
async function deleteRecord() {
  if (!modalRecordId) return;
  if (!confirm('Yakin hapus data presensi ini?')) return;

  const btn = document.getElementById('modalDeleteBtn');
  btn.textContent = 'Menghapus...';
  btn.disabled = true;

  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/' + TABLE + '?id=eq.' + modalRecordId, {
      method: 'DELETE',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Prefer': 'return=minimal',
      },
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    closeModal();
    loadData();
  } catch (err) {
    alert('Gagal menghapus: ' + err.message);
    btn.textContent = '✕ Hapus';
    btn.disabled = false;
  }
}

// ====== INIT ======
document.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
